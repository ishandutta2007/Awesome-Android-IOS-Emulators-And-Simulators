<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="orbGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanbeam {
      0% { transform: translateX(-300px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateX(1300px); opacity: 0; }
    }
    @keyframes signalPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .pill-anim-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-anim-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .scan-line { animation: scanbeam 7s linear infinite; }
    .signal { animation: signalPulse 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Atmospheric Orbs (Background layer) -->
  <circle class="orb-1" cx="180" cy="90" r="180" fill="url(#orbGlow1)" />
  <circle class="orb-2" cx="1020" cy="310" r="210" fill="url(#orbGlow2)" />

  <!-- Dynamic Circuit & Scanbeam Lines (Background decorative) -->
  <g opacity="0.3">
    <path d="M 0 100 L 300 100 L 380 180 L 820 180 L 900 100 L 1200 100" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="6,6" />
    <path d="M 0 340 L 250 340 L 330 260 L 870 260 L 950 340 L 1200 340" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" stroke-dasharray="6,6" />
    <!-- Dynamic animated scanning laser light -->
    <rect class="scan-line" y="98" width="180" height="4" fill="url(#accentCyan)" filter="url(#glowFilter)" />
  </g>

  <!-- Animated Feature Badges / Pills (Layered below the main text) -->
  <g class="pill-anim-1" transform="translate(180, 48)">
    <rect width="180" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <circle class="signal" cx="20" cy="17" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📱 Real-Device Farms</text>
  </g>

  <g class="pill-anim-2" transform="translate(500, 42)">
    <rect width="200" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#34d399" />
    <circle class="signal" cx="20" cy="17" r="5" fill="none" stroke="#34d399" stroke-width="1.5" />
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 WebRTC Streaming</text>
  </g>

  <g class="pill-anim-3" transform="translate(840, 48)">
    <rect width="180" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#a855f7" />
    <circle class="signal" cx="20" cy="17" r="5" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Self-Hosted Emulators</text>
  </g>

  <!-- Foreground Title and Subtitles (High z-index, crisp contrast) -->
  <g id="foreground-content">
    <!-- Tagline Pill -->
    <rect x="475" y="112" width="250" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1" />
    <text x="600" y="131" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#38bdf8">CURATED AWESOME MATRIX</text>

    <!-- Main Title -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Android &amp; iOS Emulators
    </text>
    <text x="600" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#accentCyan)" letter-spacing="-0.5">
      &amp; Virtual Simulators
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="600" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      SaaS Cloud Device Farms • Open-Source Virtualization • Web Streaming • CI/CD Automation
    </text>
  </g>

  <!-- Bottom Interactive Stats Bar / Feature Highlights -->
  <g transform="translate(260, 332)">
    <rect width="680" height="52" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <g transform="translate(60, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">10+ SaaS Platforms</text>
      <text y="-14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">COMPARISON &amp; PRICING</text>
    </g>

    <line x1="230" y1="12" x2="230" y2="40" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <g transform="translate(280, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399">15+ Open-Source Tools</text>
      <text y="-14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">SORTED BY GITHUB STARS</text>
    </g>

    <line x1="470" y1="12" x2="470" y2="40" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <g transform="translate(520, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a855f7">Real-Device Testing</text>
      <text y="-14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">PARITY &amp; SECURITY</text>
    </g>
  </g>
</svg>
